[project]
name = "atlas-honest-metrics"
version = "0.1.0"
description = "Atlas honest-finance-metrics Python data runtime — moments / Deflated Sharpe (Bailey-López de Prado 2014 + Lo 2002 variance floor) / PBO via CSCV computed in numpy, governed by the PHP boundary (runtime_language_boundary canon). Never reimplemented in the PHP kernel."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
