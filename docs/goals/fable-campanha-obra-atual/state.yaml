      next_active_task: T003
      worker_status: not_approved_yet_allowed_files_unknown
  - id: T003
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: Mapear evidências read-only para a obra alvo e localizar testes/comandos/docs relevantes sem gastar Fable.
