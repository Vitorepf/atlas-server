    assignee: Judge
    status: done
    reasoning_hint: high
    objective: Validar adversarialmente a obra alvo, ordem, DoD, riscos e slice plan antes de implementação.
    inputs:
      - T001 receipt
      - docs/fable-campanha-execution-prompt.md
      - docs/fable-campanha-11-dias-nxm.md
      - docs/goals/fable-campanha-obra-atual/notes/T001-obra-alvo-e-slices.md
    constraints:
      - Judge/Fable. Read-only. Não implementar.
      - 'Mandato de refutar: procurar ordem pulada, DoD fraco, proof fraca, Fable gasto em tarefa mecânica, criação medindo criação e decisão
        [OPERADOR] não escalada.'
