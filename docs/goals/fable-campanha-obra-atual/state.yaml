version: 2
goal:
  title: Campanha Fable — obra atual
  slug: fable-campanha-obra-atual
  kind: existing_plan
  tranche: Executar a primeira obra em andamento ou pendente do ledger canônico da Campanha Fable, sem pular ordem, com slices verificados, captura
    integral e auditoria final.
  status: active
  oracle:
    signal: 'A obra alvo do ledger canônico está concluída com DoD item-a-item provado, regressões verdes, captura realizada, ledger atualizado
      e final audit full_outcome_complete: true.'
    cadence: após cada Worker package, após cada refutação Judge, antes de avançar de obra e na auditoria final
    final_proof: Receipts de Scout/Judge/Worker/PM + outputs reais de comandos/testes/artefatos + ledger docs/fable-campanha-11-dias-nxm.md atualizado
      + checklist DoD da obra alvo.
  intake:
    original_request: ep Leia e execute /Users/vitorepf/develop/Atlas/atlas-server/docs/fable-campanha-goalbuddy-prep-request.md
    interpreted_outcome: Criar um GoalBuddy board durável para executar a próxima obra da Campanha Fable do Atlas com governança, receipts, prova
      por slice e retomada fria.
    input_shape: existing_plan
    audience: Operador do Atlas / Hermes PM executando no atlas-server
    authority: requested
    proof_type: test
    completion_proof: Board executado até a obra alvo estar completa conforme prompt mestre e ledger canônico, com evidências reais, captura e
      auditoria final.
    likely_misfire: Completar só o planejamento/board/discovery, ou concluir um slice isolado, sem fechar a obra alvo com DoD, captura e ledger.
    blind_spots_considered:
      - Estado do ledger pode mudar entre prep e /goal; a execução deve revalidar a primeira obra em andamento ou pendente.
      - O-1 tem Marco Zero parcialmente provado, mas ainda precisa audit/correção/captura completa antes de O-2.
      - Fable é recurso escasso; não usar em boilerplate/refactor mecânico.
      - Criação não pode medir criação; cada slice precisa de Judge/refutação independente.
      - Decisões [OPERADOR] devem ser registradas e não tomadas autonomamente.
      - Após O-3 o soak contínuo vira requisito vivo e não deve ser parado cedo.
    existing_plan_facts:
      - 'Fonte de execução: docs/fable-campanha-execution-prompt.md.'
      - 'Plano governante: docs/fable-campanha-11-dias-nxm.md.'
      - 'Workspace: /Users/vitorepf/develop/Atlas/atlas-server.'
      - 'Ledger prep-time: O-1 Sweep + Marco Zero está em andamento; O-2+ pendentes.'
      - 'Bootstrap obrigatório: /opt/homebrew/bin/php artisan atlas:ai:session-bootstrap --task="<obra>" --json.'
      - 'AOBG obrigatório: bin/atlas open-brain context "<obra>" --json.'
      - 'Placement obrigatório para peça nova: /opt/homebrew/bin/php artisan atlas:ai:place-feature "<peça>" --json.'
      - 'Captura: testes verdes, canon docs quando aplicável, KB sync, Code Intelligence index-code com --workspace, memória Atlas, ledger atualizado
        e DoD checklist.'
      - 'Modelo policy: Fable PM/Judge, Codex gpt-5.5 Worker, MiniMax M3 Scout/manutenção barata.'
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  no_order_skip: true
  creation_ne_measurement: true
  operator_decisions_not_autonomous: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
model_policy:
  pm:
    provider: anthropic
    model: claude-fable-5
    use_for:
      - campanha PM
      - arquitetura
      - sequenciamento
      - governança
      - receipts finais
  judge:
    provider: anthropic
    model: claude-fable-5
    use_for:
      - refutação adversarial
      - decisões de risco
      - auditoria final
      - código de medição/gates/imune
  worker:
    provider: openai-codex
    model: gpt-5.5
    use_for:
      - edição de código
      - testes
      - refactors mecânicos
      - correções técnicas pesadas
  scout:
    provider: minimax
    model: MiniMax-M3
    use_for:
      - mapeamento read-only simples
      - resumos
      - triagem leve
      - limpeza de receipts
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
  availability_checked:
    status: bundled GoalBuddy agent templates found at /Users/vitorepf/.hermes/skills/goalbuddy/agents/goal_*.toml; matching installed .codex/agents
      configs not found in user or atlas-server project locations checked during prep
    checked_at: 2026-06-11 prep session
visual_board:
  selected: local
  local:
    status: live
    url: http://goalbuddy.localhost:41737/fable-campanha-obra-atual/
    command: npx goalbuddy board docs/goals/fable-campanha-obra-atual
active_task: T010
tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: high
    objective: Carregar o prompt mestre e plano canônico, revalidar o ledger, confirmar a obra alvo e decompor os primeiros slices sem modificar
      código.
    inputs:
      - docs/fable-campanha-execution-prompt.md
      - docs/fable-campanha-11-dias-nxm.md
      - docs/goals/fable-campanha-obra-atual/goal.md
      - docs/goals/fable-campanha-obra-atual/state.yaml
    constraints:
      - PM/Fable. Controle de board apenas; não editar código de produto nesta tarefa.
      - Identificar a primeira obra em andamento ou pendente no ledger; prep-time indicou O-1, mas revalidar.
      - Não pular ordem O-1 -> O-2 -> O-3.
      - Registrar obra alvo, DoD e slices propostos no receipt ou notes/T001-obra-alvo-e-slices.md se longo.
      - Se houver decisão [OPERADOR] necessária, criar tarefa bloqueada específica e continuar trabalho local seguro.
    expected_output:
      - Obra alvo confirmada a partir do ledger atual.
      - DoD da obra alvo copiado/sumarizado com links/caminhos.
      - Primeiros slices com proof/verify/stop_if propostos.
      - 'Próxima tarefa ativa escolhida: bootstrap/contexto ou Judge de validação, conforme estado.'
    receipt:
      result: done
      summary: Plano e ledger canônico re-lidos; obra alvo confirmada como O-1 Sweep + Marco Zero em andamento; DoD extraído; slices O1-S0..O1-S7
        propostos sem tocar código de produto.
      evidence:
        - docs/fable-campanha-execution-prompt.md
        - docs/fable-campanha-11-dias-nxm.md:142-160
        - docs/goals/fable-campanha-obra-atual/goal.md
        - docs/goals/fable-campanha-obra-atual/state.yaml
        - docs/goals/fable-campanha-obra-atual/notes/T001-obra-alvo-e-slices.md
      target_work: O-1 — Certification Sweep da espinha de engenharia + Marco Zero
      target_status: em andamento
      next_active_task: T002
      spawned_or_refined_tasks:
        - T002
        - T003
        - T004
        - T005
        - T006
        - T999
