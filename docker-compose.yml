services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-app
    restart: unless-stopped
    command: sh -c "composer install && php artisan config:clear && php artisan migrate --force && php -S 0.0.0.0:3737 -t public public/index.php"
    ports:
      - "3737:3737"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
    working_dir: /var/www/html
    environment:
      APP_NAME: Atlas
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:3737
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas_local_2026
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: atlas
      ATLAS_TOKEN: ${ATLAS_TOKEN}
      ATLAS_STORAGE_PATH: /var/atlas/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_2026
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    # Sequência de boot:
    # 1. config:clear  → garante que migrations leem env atual, não cache antigo
    # 2. migrate       → schema atualizado
    # 3. config:cache  → compila config/* num único arquivo PHP (boot ~5-15ms mais rápido por request)
    # 4. route:cache   → compila rotas num arquivo único (resolução de URL O(1))
    # 5. php -S        → sobe o server
    command: sh -c "php artisan config:clear && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php -S 0.0.0.0:3737 -t public public/index.php"
    ports:
      - "3737:3737"
    environment:
      APP_NAME: Atlas
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:3737
      APP_VERSION: "1.0.0"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas_local_2026
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: atlas
      ATLAS_TOKEN: ${ATLAS_TOKEN}
      ATLAS_STORAGE_PATH: /var/atlas/storage
      ATLAS_MAX_UPLOAD_BYTES: "104857600"
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
      WHISPER_BIN_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODELS_DIR: /opt/whisper-models
      FFMPEG_BIN_PATH: /usr/bin/ffmpeg
      WHISPER_LANGUAGE: pt
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-3600}
      WHISPER_NORMALIZE_TIMEOUT_SECONDS: ${WHISPER_NORMALIZE_TIMEOUT_SECONDS:-300}
      ATLAS_YOUTUBE_INGESTION_ENABLED: ${ATLAS_YOUTUBE_INGESTION_ENABLED:-true}
      ATLAS_YOUTUBE_DATA_API_ENABLED: ${ATLAS_YOUTUBE_DATA_API_ENABLED:-false}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      ATLAS_YOUTUBE_DATA_API_DAILY_UNIT_LIMIT: ${ATLAS_YOUTUBE_DATA_API_DAILY_UNIT_LIMIT:-500}
      ATLAS_YOUTUBE_QUEUE: ${ATLAS_YOUTUBE_QUEUE:-transcription}
      ATLAS_YOUTUBE_CACHE_ENABLED: ${ATLAS_YOUTUBE_CACHE_ENABLED:-true}
      ATLAS_YOUTUBE_CACHE_TTL_DAYS: ${ATLAS_YOUTUBE_CACHE_TTL_DAYS:-30}
      ATLAS_YOUTUBE_AUDIO_FALLBACK_ENABLED: ${ATLAS_YOUTUBE_AUDIO_FALLBACK_ENABLED:-true}
      ATLAS_YOUTUBE_DEFER_AUDIO_FALLBACK: ${ATLAS_YOUTUBE_DEFER_AUDIO_FALLBACK:-true}
      ATLAS_YOUTUBE_YTDLP_BINARY: /usr/local/bin/yt-dlp
      ATLAS_YOUTUBE_PROCESSING_LOCK_MINUTES: ${ATLAS_YOUTUBE_PROCESSING_LOCK_MINUTES:-90}
      ATLAS_YOUTUBE_TIMEOUT_SECONDS: ${ATLAS_YOUTUBE_TIMEOUT_SECONDS:-35}
      ATLAS_YOUTUBE_AUDIO_DOWNLOAD_TIMEOUT_SECONDS: ${ATLAS_YOUTUBE_AUDIO_DOWNLOAD_TIMEOUT_SECONDS:-300}
      ATLAS_YOUTUBE_AUDIO_DOWNLOAD_RETRIES: ${ATLAS_YOUTUBE_AUDIO_DOWNLOAD_RETRIES:-2}
      ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRIES: ${ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRIES:-2}
      ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRY_SLEEP_MS: ${ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRY_SLEEP_MS:-700}
      ATLAS_YOUTUBE_AUDIO_TRANSCRIPTION_REALTIME_RATIO: ${ATLAS_YOUTUBE_AUDIO_TRANSCRIPTION_REALTIME_RATIO:-0.65}
      ATLAS_YOUTUBE_MAX_AUDIO_DURATION_SECONDS: ${ATLAS_YOUTUBE_MAX_AUDIO_DURATION_SECONDS:-7200}
      ATLAS_YOUTUBE_MAX_VIDEOS_PER_TURN: ${ATLAS_YOUTUBE_MAX_VIDEOS_PER_TURN:-2}
      ATLAS_YOUTUBE_PREFERRED_CAPTION_LANGUAGES: ${ATLAS_YOUTUBE_PREFERRED_CAPTION_LANGUAGES:-pt-BR,pt,en,ja,zh-Hans,zh-Hant,zh}
      ATLAS_YOUTUBE_CHUNK_SECONDS: ${ATLAS_YOUTUBE_CHUNK_SECONDS:-300}
      ATLAS_YOUTUBE_MAX_CHUNK_CHARS: ${ATLAS_YOUTUBE_MAX_CHUNK_CHARS:-5000}
      ATLAS_YOUTUBE_MAX_CHUNKS: ${ATLAS_YOUTUBE_MAX_CHUNKS:-80}
      ATLAS_YOUTUBE_MAX_TRANSCRIPT_CHARS: ${ATLAS_YOUTUBE_MAX_TRANSCRIPT_CHARS:-120000}
      RIZE_API_KEY: ${RIZE_API_KEY:-}
      RIZE_GRAPHQL_ENDPOINT: ${RIZE_GRAPHQL_ENDPOINT:-https://api.rize.io/api/v1/graphql}
      RIZE_TIMEZONE: ${RIZE_TIMEZONE:-America/Sao_Paulo}
      RIZE_SYNC_ENABLED: ${RIZE_SYNC_ENABLED:-true}
      RIZE_SYNC_LOOKBACK_DAYS: ${RIZE_SYNC_LOOKBACK_DAYS:-2}
      RIZE_SYNC_PAGE_SIZE: ${RIZE_SYNC_PAGE_SIZE:-100}
      RIZE_SESSIONS_QUERY_PATH: ${RIZE_SESSIONS_QUERY_PATH:-}
      RIZE_SESSIONS_ROOT_PATH: ${RIZE_SESSIONS_ROOT_PATH:-sessions.nodes}
      RIZE_SESSIONS_PAGE_INFO_PATH: ${RIZE_SESSIONS_PAGE_INFO_PATH:-sessions.pageInfo}
      ATLAS_VAULT_PATH: /atlas-vault
    volumes:
      - .:/app
      - atlas-storage:/var/atlas/storage
      - ../AtlasVault:/atlas-vault
      # Anonymous volume isola bootstrap/cache do bind mount do host.
      # Sem isso, config:cache/route:cache geram arquivos com DB_HOST=db
      # (válido só dentro do Docker) que vazam pro Mac e quebram artisan
      # rodado fora do container.
      - /app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-queue
    restart: unless-stopped
    # Queue worker reusa o config:cache que o backend criou no boot.
    # config:cache é idempotente — rodando aqui também garante que o cache
    # exista mesmo se queue subir antes do backend (depends_on resolve isso,
    # mas defesa em profundidade).
    command: sh -c "php artisan config:cache && php artisan queue:work --queue=transcription,default --tries=3 --timeout=5400"
    environment:
      APP_NAME: Atlas
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:3737
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas_local_2026
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: atlas
      ATLAS_TOKEN: ${ATLAS_TOKEN}
      ATLAS_STORAGE_PATH: /var/atlas/storage
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
      WHISPER_BIN_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODELS_DIR: /opt/whisper-models
      FFMPEG_BIN_PATH: /usr/bin/ffmpeg
      WHISPER_LANGUAGE: pt
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-3600}
      WHISPER_NORMALIZE_TIMEOUT_SECONDS: ${WHISPER_NORMALIZE_TIMEOUT_SECONDS:-300}
      ATLAS_YOUTUBE_INGESTION_ENABLED: ${ATLAS_YOUTUBE_INGESTION_ENABLED:-true}
      ATLAS_YOUTUBE_DATA_API_ENABLED: ${ATLAS_YOUTUBE_DATA_API_ENABLED:-false}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      ATLAS_YOUTUBE_DATA_API_DAILY_UNIT_LIMIT: ${ATLAS_YOUTUBE_DATA_API_DAILY_UNIT_LIMIT:-500}
      ATLAS_YOUTUBE_QUEUE: ${ATLAS_YOUTUBE_QUEUE:-transcription}
      ATLAS_YOUTUBE_CACHE_ENABLED: ${ATLAS_YOUTUBE_CACHE_ENABLED:-true}
      ATLAS_YOUTUBE_CACHE_TTL_DAYS: ${ATLAS_YOUTUBE_CACHE_TTL_DAYS:-30}
      ATLAS_YOUTUBE_AUDIO_FALLBACK_ENABLED: ${ATLAS_YOUTUBE_AUDIO_FALLBACK_ENABLED:-true}
      ATLAS_YOUTUBE_DEFER_AUDIO_FALLBACK: ${ATLAS_YOUTUBE_DEFER_AUDIO_FALLBACK:-true}
      ATLAS_YOUTUBE_YTDLP_BINARY: /usr/local/bin/yt-dlp
      ATLAS_YOUTUBE_PROCESSING_LOCK_MINUTES: ${ATLAS_YOUTUBE_PROCESSING_LOCK_MINUTES:-90}
      ATLAS_YOUTUBE_TIMEOUT_SECONDS: ${ATLAS_YOUTUBE_TIMEOUT_SECONDS:-35}
      ATLAS_YOUTUBE_AUDIO_DOWNLOAD_TIMEOUT_SECONDS: ${ATLAS_YOUTUBE_AUDIO_DOWNLOAD_TIMEOUT_SECONDS:-300}
      ATLAS_YOUTUBE_AUDIO_DOWNLOAD_RETRIES: ${ATLAS_YOUTUBE_AUDIO_DOWNLOAD_RETRIES:-2}
      ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRIES: ${ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRIES:-2}
      ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRY_SLEEP_MS: ${ATLAS_YOUTUBE_CAPTION_DOWNLOAD_RETRY_SLEEP_MS:-700}
      ATLAS_YOUTUBE_AUDIO_TRANSCRIPTION_REALTIME_RATIO: ${ATLAS_YOUTUBE_AUDIO_TRANSCRIPTION_REALTIME_RATIO:-0.65}
      ATLAS_YOUTUBE_MAX_AUDIO_DURATION_SECONDS: ${ATLAS_YOUTUBE_MAX_AUDIO_DURATION_SECONDS:-7200}
      ATLAS_YOUTUBE_MAX_VIDEOS_PER_TURN: ${ATLAS_YOUTUBE_MAX_VIDEOS_PER_TURN:-2}
      ATLAS_YOUTUBE_PREFERRED_CAPTION_LANGUAGES: ${ATLAS_YOUTUBE_PREFERRED_CAPTION_LANGUAGES:-pt-BR,pt,en,ja,zh-Hans,zh-Hant,zh}
      ATLAS_YOUTUBE_CHUNK_SECONDS: ${ATLAS_YOUTUBE_CHUNK_SECONDS:-300}
      ATLAS_YOUTUBE_MAX_CHUNK_CHARS: ${ATLAS_YOUTUBE_MAX_CHUNK_CHARS:-5000}
      ATLAS_YOUTUBE_MAX_CHUNKS: ${ATLAS_YOUTUBE_MAX_CHUNKS:-80}
      ATLAS_YOUTUBE_MAX_TRANSCRIPT_CHARS: ${ATLAS_YOUTUBE_MAX_TRANSCRIPT_CHARS:-120000}
      RIZE_API_KEY: ${RIZE_API_KEY:-}
      RIZE_GRAPHQL_ENDPOINT: ${RIZE_GRAPHQL_ENDPOINT:-https://api.rize.io/api/v1/graphql}
      RIZE_TIMEZONE: ${RIZE_TIMEZONE:-America/Sao_Paulo}
      RIZE_SYNC_ENABLED: ${RIZE_SYNC_ENABLED:-true}
      RIZE_SYNC_LOOKBACK_DAYS: ${RIZE_SYNC_LOOKBACK_DAYS:-2}
      RIZE_SYNC_PAGE_SIZE: ${RIZE_SYNC_PAGE_SIZE:-100}
      RIZE_SESSIONS_QUERY_PATH: ${RIZE_SESSIONS_QUERY_PATH:-}
      RIZE_SESSIONS_ROOT_PATH: ${RIZE_SESSIONS_ROOT_PATH:-sessions.nodes}
      RIZE_SESSIONS_PAGE_INFO_PATH: ${RIZE_SESSIONS_PAGE_INFO_PATH:-sessions.pageInfo}
      ATLAS_VAULT_PATH: /atlas-vault
    volumes:
      - .:/app
      - atlas-storage:/var/atlas/storage
      - ../AtlasVault:/atlas-vault
      - /app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-scheduler
    restart: unless-stopped
    # Scheduler reusa o config cacheado pelo backend (mesmo padrão do queue).
    command: sh -c "php artisan config:cache && php artisan schedule:work"
    environment:
      APP_NAME: Atlas
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:3737
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas_local_2026
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: atlas
      ATLAS_TOKEN: ${ATLAS_TOKEN}
      ATLAS_STORAGE_PATH: /var/atlas/storage
      RIZE_API_KEY: ${RIZE_API_KEY:-}
      RIZE_GRAPHQL_ENDPOINT: ${RIZE_GRAPHQL_ENDPOINT:-https://api.rize.io/api/v1/graphql}
      RIZE_TIMEZONE: ${RIZE_TIMEZONE:-America/Sao_Paulo}
      RIZE_SYNC_ENABLED: ${RIZE_SYNC_ENABLED:-true}
      RIZE_SYNC_LOOKBACK_DAYS: ${RIZE_SYNC_LOOKBACK_DAYS:-2}
      RIZE_SYNC_PAGE_SIZE: ${RIZE_SYNC_PAGE_SIZE:-100}
      RIZE_SESSIONS_QUERY_PATH: ${RIZE_SESSIONS_QUERY_PATH:-}
      RIZE_SESSIONS_ROOT_PATH: ${RIZE_SESSIONS_ROOT_PATH:-sessions.nodes}
      RIZE_SESSIONS_PAGE_INFO_PATH: ${RIZE_SESSIONS_PAGE_INFO_PATH:-sessions.pageInfo}
      ATLAS_VAULT_PATH: /atlas-vault
    volumes:
      - .:/app
      - atlas-storage:/var/atlas/storage
      - ../AtlasVault:/atlas-vault
      - /app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  pgdata:
    driver: local
  atlas-storage:
    driver: local
