; Atlas — OPcache config
;
; Cobre Laravel framework + vendor + app (~15-18k arquivos PHP).
; Mantém bytecode pré-compilado em shared memory entre processos PHP,
; pulando o ciclo lex/parse/compile a cada request.
;
; Modo dev-friendly: validate_timestamps=1 + revalidate_freq=2 detecta
; edições no código local (que entram no container via bind mount) em
; até 2s sem precisar reiniciar.

opcache.enable=1
; enable_cli=1 é OBRIGATÓRIO aqui: o backend roda via `php -S` (built-in
; server) que tecnicamente é processo PHP CLI. Sem isso o OPcache fica
; inerte no caminho HTTP. Comandos one-shot (artisan migrate etc) também
; ganham um pouco, mas a perda é desprezível.
opcache.enable_cli=1

; 192MB cobre o app inteiro com folga. Memory_consumption não é alocado
; lazy — é reservado no startup; Mac 16-32GB nem sente.
opcache.memory_consumption=192

; Interned strings: deduplica strings repetidas (nomes de classes/métodos).
; 16MB cobre Laravel + Atlas com folga.
opcache.interned_strings_buffer=16

; max_accelerated_files: maior primo >= número de arquivos PHP.
; Atlas + Laravel = ~15k. 20011 (próximo primo) cobre crescimento.
opcache.max_accelerated_files=20011

; Dev-friendly: checa mtime a cada 2s. Edits locais refletem rápido.
; Bind mount do /app expõe o filesystem do Mac dentro do container.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Otimizações finais
opcache.fast_shutdown=1
opcache.save_comments=1

; JIT (PHP 8+) — compila hot paths pra código nativo.
; "tracing" é o modo mais agressivo; ganho típico de 10-30% em loops/parsing.
opcache.jit_buffer_size=64M
opcache.jit=tracing
