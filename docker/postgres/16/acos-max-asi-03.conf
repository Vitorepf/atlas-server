# ASI-03 - Postgres 16 memory profile for the Atlas real corpus.
#
# This wrapper keeps the container-generated PGDATA config as the base and
# applies only the ASI-03 overrides below. Reversal is removing the compose
# config_file command/mount and restarting the db service.
include '/var/lib/postgresql/data/postgresql.conf'

# Memory sizing for the 48GiB local Atlas host: buffers stay inside the
# explicit 4-8GB cap while planner cache reflects the OS page cache.
shared_buffers = '6GB'
effective_cache_size = '24GB'

# Future HNSW/pgvector index builds need enough working memory without taking
# the whole host away from provider runtimes.
maintenance_work_mem = '2GB'

# Corpus-write pressure is concentrated in memory usage ledgers. The script
# applies table-specific storage parameters for atlas_memory_entry_usages; the
# global defaults below keep the container responsive if that table is absent.
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = '15s'
autovacuum_vacuum_cost_limit = 4000
autovacuum_vacuum_cost_delay = '2ms'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_threshold = 1000
autovacuum_analyze_threshold = 1000
