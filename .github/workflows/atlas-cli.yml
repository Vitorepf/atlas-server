name: Atlas CLI

on:
  push:
    branches:
      - main
      - develop
      - 'atlas-cli/**'
  pull_request:

jobs:
  atlas-cli:
    name: Tests and final readiness
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      ATLAS_TOKEN: testing-atlas-token-with-enough-length
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      ATLAS_AI_ENABLED: true
      ATLAS_AI_WORKDIR: ${{ github.workspace }}
      ATLAS_AI_TOOL_ALLOWED_ROOTS: ${{ github.workspace }}
      ATLAS_AI_CLAUDE_BIN: ${{ github.workspace }}/scripts/ci/claude-stub
      ATLAS_AI_CODEX_BIN: ${{ github.workspace }}/scripts/ci/codex-stub

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, pcov
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer
        run: composer validate --strict

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          chmod +x scripts/ci/claude-stub scripts/ci/codex-stub

      - name: Migrate product database
        run: php artisan migrate --force

      - name: Run tests with coverage
        run: php artisan test --coverage --min=80

      - name: Check whitespace in diff
        run: git diff --check

      - name: Atlas final readiness
        run: ./bin/atlas final --strict --refresh-providers --workspace="$PWD"

      - name: Release gate preflight
        run: ./bin/atlas release --version=v2.0.0 --preflight --no-final --skip-dogfood --allow-dirty

      - name: Build performance tracking
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-performance
          path: |
            storage/logs/*.log
            coverage.xml
