# Dependabot configuration for Atlas Server
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    reviewers:
      - vitorepf
    labels:
      - chore
    commit-message:
      prefix: deps
      include: scope
    groups:
      laravel:
        patterns:
          - laravel/*
          - illuminate/*
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    reviewers:
      - vitorepf
    labels:
      - chore
    commit-message:
      prefix: ci
      include: scope
